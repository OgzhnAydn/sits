# SİTS Marka Taklit Avcısı — CANLI CT dinleyici (Fly.io)
# HTTP servisi YOK: hep-açık bir arka plan işi. CT loglarını DOĞRUDAN okur (aracısız).
# Kurulum: bu klasörde `fly launch --no-deploy` → `fly secrets set MARKA_ADAY_SECRET=...` → `fly deploy`

app = "sits-marka-avci"
primary_region = "fra"   # Frankfurt — Türkiye'ye en yakın bölge

[build]
  dockerfile = "Dockerfile"

[env]
  SITS_URL = "https://siber-bildir-web.vercel.app"
  # DAĞITIK KAPSAM: Frankfurt YALNIZ Cloudflare (Nimbus — en yüksek-hacimli tek log; kendine
  # ayrılmış makine yetişir). Google/DigiCert/Sectigo ayrı worker'larda, TrustAsia Singapur'da.
  CT_ONLY_OP = "Cloudflare"
  PORT = "8080"
  # MARKA_ADAY_SECRET burada DEĞİL — gizli olduğu için `fly secrets set` ile verilir.

# Sağlık ucu: akış durursa (5 dk yanıt yok) Fly makineyi yeniden başlatır.
# Arka plan işi hep açık kalmalı → otomatik durdurma KAPALI, en az 1 makine.
[http_service]
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

# Kalıcı konum: restart'ta CT okuma konumunu diskten sürdür → boşluk ~0.
# Volume ÖNCE oluşturulmalı: fly volumes create ct_data --region fra --size 1
[mounts]
  source = "ct_data"
  destination = "/data"

# 18 log eşzamanlı takip. DER ön-filtresi ucuz olduğu için 2x/1GB deneriz; KAÇIRMA RİSKİ
# çıkarsa ya makineyi büyüt (fly scale) ya da operatör-başı worker'lara böl.
[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
